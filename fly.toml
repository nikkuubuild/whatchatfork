# fly.toml app configuration for WhatChat
app = "whatchat-online"
primary_region = "bom" # Mumbai, India (or sin for Singapore)

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[mounts]]
  source = "whatchat_data"
  destination = "/app/data"
  initial_size = "1gb"
