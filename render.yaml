databases:
  - name: whatchat-db
    plan: free
    region: singapore

services:
  - type: web
    name: whatchat
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: node --import tsx server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: whatchat-db
          property: connectionString
      - key: APP_BASE_URL
        value: https://whatchatfork.onrender.com
      - key: WHATSAPP_WEBHOOK_PATH
        value: /api/whatsapp/webhook
      - key: WHATSAPP_VERIFY_TOKEN
        value: whatchat_webhook_secret_2026
