<!doctype html>

    <meta charset="UTF-8" />

    <title>WhatsCloud - WhatsApp Broadcast & Chat</title>
    <script>
      // Suppress Vite dev WebSocket disconnect errors in proxy environments without WebSocket support
      window.addEventListener('error', function(event) {
        if (event && event.message && (
          event.message.includes('WebSocket') ||
          event.message.includes('@vite/client') ||
          event.message.includes('[vite]')
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (String(event.reason).includes('WebSocket') || String(event.reason?.message).includes('WebSocket'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
    <meta name="description" content="Lightweight Android-native WhatsApp Cloud API client for bulk messaging, Meta template management, and unified rich media customer chatting." />
